<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS Nexus – Computer Science Study Hub</title>
<style>
:root{--bg:#0a0a0b;--card:rgba(28,28,31,.72);--line:#2c2c31;--tx:#ececee;--mu:#9a9aa3;--ac:#c9c9d1;--gl:#7d7d88;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Arabic",Tahoma,sans-serif;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;opacity:.55}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 18px}
nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-family:Consolas,monospace;font-weight:700;letter-spacing:.5px;color:var(--ac)}
.logo b{color:#fff}
button.tr{background:#18181b;color:var(--tx);border:1px solid var(--line);padding:9px 16px;border-radius:999px;cursor:pointer;font-size:14px;transition:.25s}
button.tr:hover{border-color:var(--gl);background:#232327}
header{text-align:center;padding:64px 0 40px}
.tag{display:inline-block;font-family:Consolas,monospace;font-size:13px;color:var(--mu);border:1px solid var(--line);padding:6px 14px;border-radius:999px;background:#111113}
h1{font-size:clamp(34px,8vw,64px);margin:18px 0 12px;background:linear-gradient(180deg,#fff,#7d7d88);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.cur::after{content:"_";color:var(--ac);animation:bl 1s steps(1) infinite;-webkit-text-fill-color:var(--ac)}
@keyframes bl{50%{opacity:0}}
header p{color:var(--mu);max-width:620px;margin:0 auto;line-height:1.7}
.feat{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
.feat span{font-size:13px;color:var(--ac);background:#141416;border:1px solid var(--line);padding:7px 13px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:14px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:18px;text-decoration:none;color:inherit;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .3s,border-color .3s,box-shadow .3s;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,#aaa,transparent);opacity:0;transition:.3s}
a.card:hover{transform:translateY(-6px);border-color:#55555e;box-shadow:0 14px 40px rgba(0,0,0,.6)}
a.card:hover::before{opacity:1}
.ic{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#26262a,#141416);border:1px solid var(--line)}
.card h3{font-size:19px}
.card p{font-size:14px;color:var(--mu);line-height:1.6;flex:1}
.go{font-family:Consolas,monospace;font-size:13px;color:var(--ac)}
a.card:hover .go{color:#fff}
.soon{opacity:.6;cursor:default}
.soon .go{color:var(--gl)}
footer{margin-top:70px;padding:30px 0 10px;text-align:center;border-top:1px solid var(--line)}
footer p{color:var(--mu);font-size:14px;margin-bottom:16px}
footer p b{color:var(--tx)}
.soc{display:flex;justify-content:center;gap:16px}
.soc a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#18181b;border:1px solid var(--line);color:var(--ac);transition:.3s}
.soc a:hover{transform:translateY(-4px);color:#fff;border-color:var(--gl);box-shadow:0 8px 24px rgba(0,0,0,.6)}
.soc svg{width:22px;height:22px;fill:currentColor}
[dir=rtl] .go span{display:inline-block;transform:scaleX(-1)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
<nav>
<div class="logo">&lt;<b>CS</b>Nexus/&gt;</div>
<button class="tr" id="tr" type="button">🌐 العربية</button>
</nav>

<header>
<span class="tag" data-k="tag">// computer_science.study_hub</span>
<h1><span data-k="title">CS Nexus</span><span class="cur"></span></h1>
<p data-k="sub">Your complete study guide for Computer Science. Every course includes full slide explanations in English and Arabic, practice questions, and quizzes.</p>
<div class="feat">
<span data-k="f1">📘 Full slide explanations</span>
<span data-k="f2">🌍 Arabic &amp; English</span>
<span data-k="f3">❓ Questions</span>
<span data-k="f4">🧪 Quizzes</span>
</div>
</header>

<main class="grid" id="grid"></main>

<footer>
<p>Created by <b>Alaa Herzallah</b></p>
<div class="soc">
<a href="https://instagram.com/alaaherzallah05" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.2-3.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"/></svg></a>
<a href="https://wa.me/962775725298" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.200Zm4.500-6.100c-.2-.1-1.500-.7-1.700-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.200-.3.200-.5.100-1.400-.7-2.400-1.300-3.300-2.900-.2-.3.200-.3.700-1.100.1-.2 0-.3 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.100-.7.300-.7.700-1 1.500-.9 2.400.2 1.100.7 2.100 1.800 3.300 1.800 2 3.500 2.700 5 3 .8.200 1.600.100 2.200-.4.400-.4.700-1 .8-1.600 0-.2 0-.3-.1-.4l-.9-.5Z"/></svg></a>
</div>
</footer>
</div>

<script>
var courses=[
{i:"🖥️",en:"Operating Systems",ar:"أنظمة التشغيل",u:"https://alaa-herz05.github.io/Os-study-guide/"},
{i:"🤖",en:"Artificial Intelligence",ar:"الذكاء الاصطناعي",u:"https://alaa-herz05.github.io/ai-study-guides/"},
{i:"☁️",en:"Cloud Computing",ar:"الحوسبة السحابية",u:"https://alaa-herz05.github.io/cloud-computing-study-guides/"},
{i:"🧠",en:"Computer Architecture",ar:"معمارية الحاسوب",u:"https://alaa-herz05.github.io/COA-Summary/"},
{i:"🌐",en:"Networks &amp; Data Communication",ar:"الشبكات واتصالات البيانات",u:"https://alaa-herz05.github.io/Networks-Data-Communications-Study-Hub/"},
{i:"🎬",en:"Multimedia",ar:"الوسائط المتعددة",u:"https://alaa-herz05.github.io/Multimedia-Learning-Hub/index.html"}];
var T={en:{tag:"// computer_science.study_hub",title:"CS Nexus",sub:"Your complete study guide for Computer Science. Every course includes full slide explanations in English and Arabic, practice questions, and quizzes.",f1:"📘 Full slide explanations",f2:"🌍 Arabic & English",f3:"❓ Questions",f4:"🧪 Quizzes",d:"Full slide explanations (EN/AR), questions and quizzes.",o:"Open guide",s:"Coming soon",b:"🌐 العربية"},
ar:{tag:"// computer_science.study_hub",title:"CS Nexus",sub:"دليلك الشامل لدراسة علوم الحاسوب. كل مادة تحتوي على شرح كامل للسلايدات بالعربية والإنجليزية، مع أسئلة وكويزات.",f1:"📘 شرح شامل للسلايدات",f2:"🌍 عربي وإنجليزي",f3:"❓ أسئلة",f4:"🧪 كويزات",d:"شرح شامل للسلايدات (عربي/إنجليزي) مع أسئلة وكويزات.",o:"افتح الدليل",s:"قريبًا",b:"🌐 English"}};
var lang="en";
function render(){
var t=T[lang],g=document.getElementById("grid"),h="";
courses.forEach(function(c){
var n=lang==="en"?c.en:c.ar;
if(c.u){h+='<a class="card" href="'+c.u+'" target="_blank" rel="noopener"><div class="ic">'+c.i+'</div><h3>'+n+'</h3><p>'+t.d+'</p><div class="go">'+t.o+' <span>→</span></div></a>';}
else{h+='<div class="card soon"><div class="ic">'+c.i+'</div><h3>'+n+'</h3><p>'+t.d+'</p><div class="go">'+t.s+'</div></div>';}
});
g.innerHTML=h;
document.querySelectorAll("[data-k]").forEach(function(e){e.innerHTML=t[e.getAttribute("data-k")].replace("&","&amp;");});
document.getElementById("tr").textContent=t.b;
document.documentElement.lang=lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
}
document.getElementById("tr").onclick=function(){lang=lang==="en"?"ar":"en";render();};
render();

/* animated CS background: falling binary + code symbols */
var cv=document.getElementById("bg"),x=cv.getContext("2d"),cols,drops,fs=16;
var chars="01{}<>/;=()[]&|#$%+-*";
function size(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(cv.width/fs);drops=[];for(var i=0;i<cols;i++)drops[i]=Math.random()*cv.height/fs;}
size();addEventListener("resize",size);
function draw(){
x.fillStyle="rgba(10,10,11,.1)";x.fillRect(0,0,cv.width,cv.height);
x.font=fs+"px Consolas,monospace";
for(var i=0;i<cols;i++){
var ch=chars.charAt(Math.floor(Math.random()*chars.length));
x.fillStyle=Math.random()>.97?"#d8d8de":"#4a4a52";
x.fillText(ch,i*fs,drops[i]*fs);
if(drops[i]*fs>cv.height&&Math.random()>.975)drops[i]=0;
drops[i]+=.5;
}
}
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)setInterval(draw,50);
</script>
</body>
</html>
